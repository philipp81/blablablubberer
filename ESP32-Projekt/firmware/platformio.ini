; Blablablubber Megafon – Firmware für ESP32
; Bauen:   pio run -e esp32dev
; Flashen: pio run -e esp32dev -t upload
; Monitor: pio device monitor
[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.13.0      ; Arduino-Core 2.0.17, klassische I2S-API
platform_packages = platformio/tool-esptoolpy@~1.40501.0   ; esptool 4.5.1, neuere Versionen brauchen das Python-Modul intelhex
framework = arduino
monitor_speed = 115200
build_flags = -Wall -O2

; Standard-Entwicklungsboard (ESP32-WROOM-32), Laderegler extern (TP4056)
[env:esp32dev]
board = esp32dev

; Wemos Lolin D32: LiPo-/Li-Ion-Anschluss und Laderegler an Bord
[env:lolin_d32]
board = lolin_d32

; Testfirmware: Abzug spielt einen 440-Hz-Sinus (Ausgang, Verstärker, Lautsprecher, Strom prüfen)
[env:test_sinus]
board = esp32dev
build_flags = ${env.build_flags} -DTEST_MODE=1

; Testfirmware: Abzug reicht das Mikrofon ohne Effekt durch (Mikrofonpegel prüfen)
[env:test_direkt]
board = esp32dev
build_flags = ${env.build_flags} -DTEST_MODE=2
